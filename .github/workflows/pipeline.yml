name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project_mlops/requirements.txt

      - name: Validate dataset
        run: |
          python tourism_project_mlops/model_building/data_register.py

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project_mlops/requirements.txt

      - name: Prepare train/test data
        run: |
          python tourism_project_mlops/model_building/prep.py

      - name: Upload train/test splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            tourism_project_mlops/artifacts/train.csv
            tourism_project_mlops/artifacts/test.csv

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project_mlops/requirements.txt

      - name: Download train/test splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project_mlops/artifacts

      - name: Train and evaluate model
        run: |
          python tourism_project_mlops/model_building/train.py

      - name: Upload MLflow run data
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs
          path: tourism_project_mlops/mlruns

      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tourism_project_mlops/deployment/model.joblib
          git add tourism_project_mlops/deployment/feature_schema.json
          git commit -m "Update trained tourism model [skip ci]" || echo "No model changes to commit"
          git push
